<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby - LittleRPG</title>
    <link rel="icon" type="image/png" href="/medias/littlerpg_favicon_32.png">

    <!-- Styles -->
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/layouts.css">
</head>

<body class="dashboard-layout">
    <!-- Navigation injected by nav.js -->

    <div class="container py-4"> <!-- Reduced padding -->
        <div class="card max-w-4xl mx-auto shadow-2xl bg-opacity-90"> <!-- Increased max-width -->

            <!-- Sticky Action Header -->
            <div
                class="lobby-header-actions mb-6 p-4 rounded bg-surface border border-color-border flex justify-between items-center sticky top-20 z-10 shadow-lg">
                <div class="flex items-center gap-4">
                    <h1 class="text-2xl font-bold m-0">Lobby</h1>
                    <div id="lobby-code"
                        class="lobby-code-badge text-xl font-mono bg-bg-tertiary px-3 py-1 rounded border border-accent-primary text-accent-primary">
                        ------</div>
                </div>

                <div class="flex gap-2">
                    <!-- Buttons are inside player cards now -->
                    <button class="btn btn-primary hidden" id="start-game-btn">
                        🚩 LANCER MISSION
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Left Column: Players -->
                <div class="lobby-section flex flex-col">
                    <div class="section-header mb-2">
                        <h2 class="section-title text-xl">Vos compagnons de route arrivent... (<span
                                id="player-count">0</span>/3)</h2>
                    </div>
                    <div id="player-list" class="player-list h-64 overflow-y-auto pr-2 custom-scrollbar mb-2">
                        <!-- Players will be rendered here -->
                    </div>
                    <div class="flex justify-end">
                        <button class="btn btn-secondary btn-sm" id="leave-lobby-btn">
                            🚪 Quitter
                        </button>
                    </div>
                </div>

                <!-- Right Column: Chat & Info -->
                <div class="lobby-section flex flex-col h-full">
                    <div class="section-header mb-4">
                        <h2 class="section-title text-xl">Chat d'Escouade</h2>
                    </div>

                    <div class="chat-container flex-1 flex flex-col mb-0" style="min-height: 250px;">
                        <div id="chat-messages"
                            class="chat-messages flex-1 overflow-y-auto mb-4 p-2 bg-bg-tertiary rounded">
                            <div class="text-xs text-center text-muted">Système: Bienvenue dans le lobby !</div>
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="chat-input" class="form-input" placeholder="Message..."
                                maxlength="200">
                            <button class="btn btn-primary" id="send-chat-btn">Envoyer</button>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/lobby.js"></script>
</body>

</html>
